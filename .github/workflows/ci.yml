name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DATABASE_URL: ''
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Generate route-aware helpers before TypeScript checks on a fresh checkout.
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Chromium desktop and mobile end-to-end tests
        run: npm run test:e2e -- --project=chromium-desktop --project=chromium-mobile
